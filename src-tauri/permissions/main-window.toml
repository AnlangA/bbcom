[[permission]]
identifier = "main-window-commands"
description = "Allows only the bbcom commands needed by the main application window."
commands.allow = [
  "calculate_checksum",
  "abort_export",
  "append_export_batch",
  "begin_export",
  "finish_export",
  "request_save_target",
  "revoke_file_grant",
  "abort_auto_log",
  "append_auto_log_batch",
  "begin_auto_log",
  "finish_auto_log",
  "drain_serial_input",
  "begin_legacy_backup",
  "verify_legacy_backup",
  "get_legacy_reset_journal",
  "begin_legacy_discard",
  "prepare_legacy_reset",
  "complete_legacy_reset",
  "clear_ai_api_key",
  "get_ai_key_status",
  "migrate_ai_api_key",
  "set_ai_api_key",
  "run_ai_request",
  "cancel_ai_request",
  "get_ai_window_state",
  "hide_ai_window",
  "resize_ai_window",
  "show_ai_window",
  "submit_shutdown_report",
  "confirm_exit",
  "cancel_exit",
  "workspace_catalog",
  "create_workspace",
  "open_workspace",
  "apply_workspace_batch",
  "flush_workspace",
  "hydrate_workspace_sessions",
  "hydrate_workspace_frames",
  "hydrate_workspace_collections",
  "hydrate_workspace_ai_messages",
  "hydrate_workspace_waveform",
  "request_project_source_grant",
  "request_project_target_grant",
  "import_project",
  "export_project",
  "cancel_workspace_operation",
]
