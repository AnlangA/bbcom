[package]
name = "bbcom"
version = "0.7.3"
description = "Serial Port Assistant"
edition = "2024"
rust-version = "1.97"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
bbcom-contracts = { path = "../crates/bbcom-contracts" }
bbcom-plugin-contracts = { path = "../crates/bbcom-plugin-contracts" }
bbcom-plugin-broker = { path = "../crates/bbcom-plugin-broker" }
bbcom-plugin-host = { path = "../crates/bbcom-plugin-host" }
bbcom-plugin-manager = { path = "../crates/bbcom-plugin-manager" }
bbcom-plugin-repository = { path = "../crates/bbcom-plugin-repository" }
bbcom-workspace = { path = "../crates/bbcom-workspace" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-serialplugin = "=3.0.0"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
semver = "=1.0.27"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
crc = "=3.4.0"
chrono = "=0.4.45"
getrandom = "=0.4.3"
keyring = "=4.1.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
zeroize = "=1.9.0"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zai-rs = "=0.5.0"
wat = "=1.252.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
base64 = "=0.22.1"
criterion = { version = "=0.8.2", default-features = false, features = ["plotters", "cargo_bench_support"] }
tempfile = "=3.27.0"

# perf: separate bench target so `cargo bench` only compiles the criterion
# harness, not the full Tauri app (faster iteration, no codegen regression on
# the main build).
[[bench]]
name = "hot_paths"
harness = false

# The desktop launcher delegates directly to the library's `run` entry point.
# It has no standalone unit-test surface; disabling Cargo's synthetic zero-test
# binary target prevents it from being instrumented as a second, unexecuted
# copy of the library during workspace coverage collection.
[[bin]]
name = "bbcom"
path = "src/main.rs"
test = false
bench = false
