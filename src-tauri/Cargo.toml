[package]
name = "bbcom"
version = "0.4.0"
description = "Serial Port Assistant"
edition = "2024"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-serialplugin = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crc = "3"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
zai-rs = "0.1.14"
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

# perf: separate bench target so `cargo bench` only compiles the criterion
# harness, not the full Tauri app (faster iteration, no codegen regression on
# the main build).
[[bench]]
name = "hot_paths"
harness = false
