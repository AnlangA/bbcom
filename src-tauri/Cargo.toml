[package]
name = "bbcom"
version = "1.0.3"
description = "Serial Port Assistant"
edition = "2024"
rust-version = "1.97"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
bbcom-contracts = { path = "../crates/bbcom-contracts" }
bbcom-workspace = { path = "../crates/bbcom-workspace" }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-serialplugin = "=3.0.0"
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-opener = "=2.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
crc = "=3.4.0"
chrono = "=0.4.45"
getrandom = "=0.4.3"
mcumgr-toolkit = "=0.16.0"
serialport = { version = "=4.9.0", default-features = false }
ciborium = "=0.2.2"
hex = "=0.4.3"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
zai-rs = "=0.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
base64 = "=0.22.1"
tempfile = "=3.27.0"

# The desktop launcher delegates directly to the library's `run` entry point.
# It has no standalone unit-test surface; disabling Cargo's synthetic zero-test
# binary target prevents it from being instrumented as a second, unexecuted
# copy of the library during workspace coverage collection.
[[bin]]
name = "bbcom"
path = "src/main.rs"
test = false
bench = false
