packages:
  - .

nodeVersion: 24.13.0
engineStrict: true
runtimeOnFail: download

verifyDepsBeforeRun: false
confirmModulesPurge: false

overrides:
  'brace-expansion@>=1.0.0 <1.1.18': 1.1.18
  'brace-expansion@>=2.0.0 <2.1.4': 2.1.4
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9
  'deepmerge-ts@<8.0.0': 8.0.1
  'ip-address@>=10.0.0 <=10.3.0': 10.3.1
  'js-yaml@>=5.0.0 <=5.2.1': 5.2.2
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'postcss@>=8.0.0 <=8.5.22': 8.5.23
  'undici@>=6.0.0 <6.28.0': 6.28.0
  'undici@>=7.0.0 <7.29.0': 7.29.0

allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@lucide/vue@1.24.0'
  - prettier@3.9.5

auditConfig:
  # Dev-only WebdriverIO/Puppeteer archive fetcher; no application/runtime path.
  # Upstream has not published the advisory's stated 2.0.2 patched release.
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

patchedDependencies:
  '@wdio/tauri-service@1.2.0': patches/@wdio__tauri-service@1.2.0.patch
