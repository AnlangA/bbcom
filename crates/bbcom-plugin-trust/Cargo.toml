[package]
name = "bbcom-plugin-trust"
version = "0.1.0"
description = "Fail-closed TUF and publisher trust core for bbcom plugin repositories"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
atomic-write-file = "=0.3.1"
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
time = { version = "=0.3.53", features = ["parsing"] }
url = "=2.5.8"

[lints.rust]
unsafe_code = "forbid"
