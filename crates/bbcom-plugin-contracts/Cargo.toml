[package]
name = "bbcom-plugin-contracts"
version = "0.1.0"
description = "Versioned plugin protocol, manifest, repository, and permission contracts for bbcom"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
bbcom-contracts = { path = "../bbcom-contracts" }
prost = "=0.14.4"
semver = { version = "=1.0.27", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
toml = "=0.9.8"
url = "=2.5.8"

[build-dependencies]
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.2.0"
