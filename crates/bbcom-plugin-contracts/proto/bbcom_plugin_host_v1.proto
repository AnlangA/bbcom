syntax = "proto3";

package bbcom.plugin.host.v1;

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  uint64 request_id = 3;

  oneof payload {
    HostHello host_hello = 10;
    PluginHello plugin_hello = 11;
    InvokeRequest invoke_request = 12;
    InvokeResponse invoke_response = 13;
    CancelRequest cancel_request = 14;
    Event event = 15;
    Error error = 16;
    PutStateChunkRequest put_state_chunk_request = 17;
    PutStateChunkResponse put_state_chunk_response = 18;
    InitializeRequest initialize_request = 19;
    InitializeResponse initialize_response = 20;
    GetStateChunkRequest get_state_chunk_request = 21;
    GetStateChunkResponse get_state_chunk_response = 22;
    ShutdownRequest shutdown_request = 23;
    ShutdownResponse shutdown_response = 24;
    CompleteShutdownRequest complete_shutdown_request = 25;
    CompleteShutdownResponse complete_shutdown_response = 26;
  }
}

message HostHello {
  string wit_package = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  repeated string granted_capabilities = 4;
}

message PluginHello {
  string plugin_id = 1;
  string plugin_version = 2;
  string wit_package = 3;
}

message InvokeRequest {
  string method = 1;
  bytes body = 2;
  bool long_running = 3;
}

message InvokeResponse {
  bytes body = 1;
}

message CancelRequest {
  uint64 target_request_id = 1;
}

message Event {
  string topic = 1;
  bytes body = 2;
}

message Error {
  string code = 1;
  string message_key = 2;
  bool retryable = 3;
}

enum OpaqueStateKind {
  OPAQUE_STATE_KIND_UNSPECIFIED = 0;
  OPAQUE_STATE_KIND_PLUGIN_STORAGE = 1;
  OPAQUE_STATE_KIND_PROJECT_STATE = 2;
}

// State is transferred as opaque chunks so the fixed 1 MiB frame limit remains
// independent from the 16 MiB per-plugin persistence limit. Chunks are accepted
// only in increasing offset order and never contain a filesystem path.
message PutStateChunkRequest {
  uint32 state_schema_version = 1;
  OpaqueStateKind kind = 2;
  uint64 total_bytes = 3;
  uint64 offset = 4;
  bytes payload = 5;
  bool final_chunk = 6;
}

message PutStateChunkResponse {
  OpaqueStateKind kind = 1;
  uint64 accepted_bytes = 2;
}

message InitializeRequest {
  uint32 state_schema_version = 1;
  bool has_plugin_storage = 2;
  bool has_project_state = 3;
}

message StateSnapshotDescriptor {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
  uint64 plugin_storage_bytes = 3;
  bool has_project_state = 4;
  uint64 project_state_bytes = 5;
}

message InitializeResponse {
  StateSnapshotDescriptor state = 1;
}

message GetStateChunkRequest {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
  OpaqueStateKind kind = 3;
  uint64 offset = 4;
  uint32 max_bytes = 5;
}

message GetStateChunkResponse {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
  OpaqueStateKind kind = 3;
  uint64 offset = 4;
  uint64 total_bytes = 5;
  bytes payload = 6;
}

message ShutdownRequest {
  uint32 state_schema_version = 1;
}

message ShutdownResponse {
  StateSnapshotDescriptor state = 1;
}

// Shutdown is deliberately two-phase: the host remains alive after
// ShutdownResponse so the launcher can retrieve and durably persist state.
message CompleteShutdownRequest {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
}

message CompleteShutdownResponse {}

// Host-private encoding inside the opaque plugin-storage payload. Native
// launchers persist these bytes without interpreting keys or values.
message PluginStorageSnapshot {
  uint32 state_schema_version = 1;
  repeated PluginStorageEntry entries = 2;
}

message PluginStorageEntry {
  string key = 1;
  bytes value = 2;
}
