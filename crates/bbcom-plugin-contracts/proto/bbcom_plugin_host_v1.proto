syntax = "proto3";

package bbcom.plugin.host.v1;

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  uint64 request_id = 3;

  oneof payload {
    HostHello host_hello = 10;
    PluginHello plugin_hello = 11;
    InvokeRequest invoke_request = 12;
    InvokeResponse invoke_response =  13;
    CancelRequest cancel_request = 14;
    Event event = 15;
    Error error = 16;
    PutStateChunkRequest put_state_chunk_request = 17;
    PutStateChunkResponse put_state_chunk_response = 18;
    InitializeRequest initialize_request = 19;
    InitializeResponse initialize_response = 20;
    GetStateChunkRequest get_state_chunk_request = 21;
    GetStateChunkResponse get_state_chunk_response = 22;
    ShutdownRequest shutdown_request = 23;
    ShutdownResponse shutdown_response = 24;
    CompleteShutdownRequest complete_shutdown_request = 25;
    CompleteShutdownResponse complete_shutdown_response = 26;
    // Sidecar→main pushes awaited by parked WIT host imports (request_id 0).
    SerialProposalEvent serial_proposal_event = 27;
    SessionQueryRequest session_query_request = 28;
    // Main→sidecar replies correlated by proposal/query id (request_id 0).
    ProposalResult proposal_result = 29;
    SessionQueryResponse session_query_response = 30;
  }
}

message HostHello {
  string wit_package = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  repeated string granted_capabilities = 4;
}

message PluginHello {
  string plugin_id = 1;
  string plugin_version = 2;
  string wit_package = 3;
}

message InvokeRequest {
  string method = 1;
  bytes body = 2;
  bool long_running = 3;
}

message InvokeResponse {
  bytes body = 1;
}

message CancelRequest {
  uint64 target_request_id = 1;
}

message Event {
  string topic = 1;
  bytes body = 2;
}

message Error {
  string code = 1;
  string message_key = 2;
  bool retryable = 3;
}

enum OpaqueStateKind {
  OPAQUE_STATE_KIND_UNSPECIFIED = 0;
  OPAQUE_STATE_KIND_PLUGIN_STORAGE = 1;
  OPAQUE_STATE_KIND_PROJECT_STATE = 2;
}

// State is transferred as opaque chunks so the fixed 1 MiB frame limit remains
// independent from the 16 MiB per-plugin persistence limit. Chunks are accepted
// only in increasing offset order and never contain a filesystem path.
message PutStateChunkRequest {
  uint32 state_schema_version = 1;
  OpaqueStateKind kind = 2;
  uint64 total_bytes = 3;
  uint64 offset = 4;
  bytes payload = 5;
  bool final_chunk = 6;
}

message PutStateChunkResponse {
  OpaqueStateKind kind = 1;
  uint64 accepted_bytes = 2;
}

message InitializeRequest {
  uint32 state_schema_version = 1;
  bool has_plugin_storage = 2;
  bool has_project_state = 3;
}

message StateSnapshotDescriptor {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
  uint64 plugin_storage_bytes = 3;
  bool has_project_state = 4;
  uint64 project_state_bytes = 5;
}

message InitializeResponse {
  StateSnapshotDescriptor state = 1;
  bytes panel_json = 2;
}

message GetStateChunkRequest {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
  OpaqueStateKind kind = 3;
  uint64 offset = 4;
  uint32 max_bytes = 5;
}

message GetStateChunkResponse {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
  OpaqueStateKind kind = 3;
  uint64 offset = 4;
  uint64 total_bytes = 5;
  bytes payload = 6;
}

message ShutdownRequest {
  uint32 state_schema_version = 1;
}

message ShutdownResponse {
  StateSnapshotDescriptor state = 1;
}

// Shutdown is deliberately two-phase: the host remains alive after
// ShutdownResponse so the launcher can retrieve and durably persist state.
message CompleteShutdownRequest {
  uint32 state_schema_version = 1;
  uint64 revision = 2;
}

message CompleteShutdownResponse {}

// Host-private encoding inside the opaque plugin-storage payload. Native
// launchers persist these bytes without interpreting keys or values.
message PluginStorageSnapshot {
  uint32 state_schema_version = 1;
  repeated PluginStorageEntry entries = 2;
}

message PluginStorageEntry {
  string key = 1;
  bytes value = 2;
}

// --- Serial write proposals (sidecar→main push, decision reply) ---

// Emitted when a guest calls propose-serial-send. The sidecar's WIT import
// parks the guest call until the correlated ProposalResult arrives or the
// broker TTL (60s) elapses. payload is bounded by MAX_FRAME_BYTES.
message SerialProposalEvent {
  string plugin_id = 1;
  string proposal_id = 2;
  string operation_id = 3;
  string session_id = 4;
  string display_label = 5;
  bytes payload = 6;
}

enum ProposalOutcomeValue {
  PROPOSAL_OUTCOME_VALUE_UNSPECIFIED = 0;
  PROPOSAL_OUTCOME_VALUE_APPROVED = 1;  // the write was executed
  PROPOSAL_OUTCOME_VALUE_REJECTED = 2;
  PROPOSAL_OUTCOME_VALUE_EXPIRED = 3;   // TTL elapsed without a decision
}

message ProposalResult {
  string proposal_id = 1;
  ProposalOutcomeValue outcome = 2;
}

// --- G43 session metadata / capture queries (sidecar→main, data reply) ---

message SessionListQuery {}

message CaptureReadQuery {
  string session_id = 1;
  uint64 from_sequence = 2;
  uint32 max_frames = 3;
  uint32 max_bytes = 4;
}

message SessionQueryRequest {
  string plugin_id = 1;
  string query_id = 2;
  oneof query {
    SessionListQuery list = 3;
    CaptureReadQuery capture = 4;
  }
}

message SessionMetadataEntry {
  string session_id = 1;
  string name = 2;
  string kind = 3;
  bool connected = 4;
  uint64 rx_bytes = 5;
  uint64 tx_bytes = 6;
}

message CaptureFrameEntry {
  uint64 sequence = 1;
  uint64 timestamp_ms = 2;
  bool tx = 3;
  bytes payload = 4;
}

// ok=false carries a stable contract error name in error_code (permission-
// denied, invalid-input, not-found, limit-exceeded). next_sequence is set
// when more capture frames remain after this page.
message SessionQueryResponse {
  string query_id = 1;
  bool ok = 2;
  string error_code = 3;
  repeated SessionMetadataEntry sessions = 4;
  repeated CaptureFrameEntry frames = 5;
  uint64 next_sequence = 6;
  bool has_more = 7;
}
