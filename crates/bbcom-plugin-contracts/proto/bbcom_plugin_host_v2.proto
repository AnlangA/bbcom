syntax = "proto3";

package bbcom.plugin.host.v2;

// Protocol-v2 never uses message_id=0. reply_to is present on responses and
// errors and absent on independent requests/events. Stream correlation uses an
// explicit stream_id so stream chunks remain bounded and independently paced.
message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  uint64 message_id = 3;
  optional uint64 reply_to = 4;

  oneof payload {
    Handshake handshake = 10;
    Request request = 11;
    Response response = 12;
    Event event = 13;
    Cancel cancel = 14;
    Stream stream = 15;
    Error error = 16;
  }
}

message Handshake {
  oneof hello {
    HostHello host = 1;
    PluginHello plugin = 2;
  }
}

message PluginIdentity {
  string plugin_id = 1;
  string plugin_version = 2;
  string component_sha256 = 3;
}

message ResourceLimits {
  uint64 max_frame_bytes = 1;
  uint64 max_queue_bytes = 2;
  uint32 max_stream_chunk_bytes = 3;
  uint32 max_concurrent_streams = 4;
  uint32 max_pending_host_requests = 5;
  uint64 wasm_memory_limit_bytes = 6;
  uint64 host_process_memory_limit_bytes = 7;
  uint32 call_timeout_ms = 8;
  uint32 serial_read_timeout_ms = 9;
  uint64 long_task_timeout_ms = 10;
  uint32 activity_timeout_ms = 11;
  uint32 max_ui_document_bytes = 12;
  uint32 max_ui_nodes = 13;
}

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_UI_WORKSPACE = 1;
  CAPABILITY_UI_DETACHED_WINDOW = 2;
  CAPABILITY_SERIAL_PORTS_READ = 3;
  CAPABILITY_SERIAL_SESSIONS_MANAGE = 4;
  CAPABILITY_SERIAL_IO = 5;
  CAPABILITY_SERIAL_CONTROL_LINES = 6;
  CAPABILITY_SESSION_CAPTURE_READ = 7;
  CAPABILITY_SESSION_COMMANDS_READ_WRITE = 8;
  CAPABILITY_FILE_OPEN_READ = 9;
  CAPABILITY_FILE_SAVE_WRITE = 10;
  CAPABILITY_PLUGIN_STORAGE = 11;
  CAPABILITY_PROJECT_STATE_READ_WRITE = 12;
}

message HostHello {
  uint32 protocol_major = 1;
  uint32 min_minor = 2;
  uint32 max_minor = 3;
  string wit_package = 4;
  PluginIdentity plugin = 5;
  repeated Capability granted_capabilities = 6;
  ResourceLimits limits = 7;
  string workspace_id = 8;
  string instance_id = 9;
  uint64 generation = 10;
}

message PluginHello {
  uint32 protocol_major = 1;
  uint32 min_minor = 2;
  uint32 max_minor = 3;
  string wit_package = 4;
  PluginIdentity plugin = 5;
  repeated Capability required_capabilities = 6;
  ResourceLimits accepted_limits = 7;
  uint32 negotiated_minor = 8;
}

message Request {
  oneof operation {
    InitializeRequest initialize = 10;
    HandleEventRequest handle_event = 11;
    RunCommandRequest run_command = 12;
    MigrateStateRequest migrate_state = 13;
    ShutdownRequest shutdown = 14;

    PublishSurfaceSnapshotRequest publish_surface_snapshot = 20;
    PublishSurfacePatchRequest publish_surface_patch = 21;
    RegisterSurfaceRequest register_surface = 22;
    UnregisterSurfaceRequest unregister_surface = 23;
    RegisterCommandRequest register_command = 24;
    UnregisterCommandRequest unregister_command = 25;
    ReportProgressRequest report_progress = 26;
    HeartbeatRequest heartbeat = 27;

    ListPortsRequest list_ports = 30;
    ListSessionsRequest list_sessions = 31;
    CreateSessionRequest create_session = 32;
    UpdateSessionRequest update_session = 33;
    ConnectSessionRequest connect_session = 34;
    DisconnectSessionRequest disconnect_session = 35;
    DeleteSessionRequest delete_session = 36;
    AcquireSerialLeaseRequest acquire_serial_lease = 37;
    ReleaseSerialLeaseRequest release_serial_lease = 38;
    SerialReadRequest serial_read = 39;
    SerialWriteRequest serial_write = 40;
    ClearSerialBuffersRequest clear_serial_buffers = 41;
    PendingSerialBytesRequest pending_serial_bytes = 42;
    SetOutputLinesRequest set_output_lines = 43;
    ReadInputLinesRequest read_input_lines = 44;
    CaptureReadRequest capture_read = 45;

    UpsertQuickCommandRequest upsert_quick_command = 50;
    DeleteQuickCommandRequest delete_quick_command = 51;
    UpsertMacroRequest upsert_macro = 52;
    DeleteMacroRequest delete_macro = 53;

    OpenReadGrantRequest open_read_grant = 60;
    ReadGrantChunkRequest read_grant_chunk = 61;
    CloseReadGrantRequest close_read_grant = 62;
    CreateSaveGrantRequest create_save_grant = 63;
    WriteSaveGrantRequest write_save_grant = 64;
    CommitSaveGrantRequest commit_save_grant = 65;
    CancelSaveGrantRequest cancel_save_grant = 66;

    StorageGetRequest storage_get = 70;
    StorageSetRequest storage_set = 71;
    StorageDeleteRequest storage_delete = 72;
    ProjectStateGetRequest project_state_get = 73;
    ProjectStateSetRequest project_state_set = 74;
  }
}

message Response {
  oneof result {
    InitializeResponse initialize = 10;
    HandleEventResponse handle_event = 11;
    RunCommandResponse run_command = 12;
    MigrateStateResponse migrate_state = 13;
    OperationAck shutdown = 14;

    OperationAck publish_surface_snapshot = 20;
    OperationAck publish_surface_patch = 21;
    OperationAck register_surface = 22;
    OperationAck unregister_surface = 23;
    OperationAck register_command = 24;
    OperationAck unregister_command = 25;
    OperationAck report_progress = 26;
    OperationAck heartbeat = 27;

    ListPortsResponse list_ports = 30;
    ListSessionsResponse list_sessions = 31;
    SessionResponse create_session = 32;
    SessionResponse update_session = 33;
    SessionResponse connect_session = 34;
    OperationAck disconnect_session = 35;
    OperationAck delete_session = 36;
    AcquireSerialLeaseResponse acquire_serial_lease = 37;
    OperationAck release_serial_lease = 38;
    SerialReadResponse serial_read = 39;
    SerialWriteResponse serial_write = 40;
    OperationAck clear_serial_buffers = 41;
    PendingSerialBytesResponse pending_serial_bytes = 42;
    OperationAck set_output_lines = 43;
    ReadInputLinesResponse read_input_lines = 44;
    CaptureReadResponse capture_read = 45;

    ContributionResponse upsert_quick_command = 50;
    OperationAck delete_quick_command = 51;
    ContributionResponse upsert_macro = 52;
    OperationAck delete_macro = 53;

    OpenReadGrantResponse open_read_grant = 60;
    ReadGrantChunkResponse read_grant_chunk = 61;
    OperationAck close_read_grant = 62;
    CreateSaveGrantResponse create_save_grant = 63;
    WriteSaveGrantResponse write_save_grant = 64;
    OperationAck commit_save_grant = 65;
    OperationAck cancel_save_grant = 66;

    StorageGetResponse storage_get = 70;
    OperationAck storage_set = 71;
    OperationAck storage_delete = 72;
    ProjectStateGetResponse project_state_get = 73;
    OperationAck project_state_set = 74;
  }
}

message OperationAck {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_INPUT = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_UNAVAILABLE = 3;
  ERROR_CODE_BUSY = 4;
  ERROR_CODE_NOT_FOUND = 5;
  ERROR_CODE_STALE_HANDLE = 6;
  ERROR_CODE_DISCONNECTED = 7;
  ERROR_CODE_TIMEOUT = 8;
  ERROR_CODE_CANCELLED = 9;
  ERROR_CODE_LIMIT_EXCEEDED = 10;
  ERROR_CODE_PARTIAL_WRITE = 11;
  ERROR_CODE_UNKNOWN_OUTCOME = 12;
  ERROR_CODE_PROTOCOL_ERROR = 13;
  ERROR_CODE_IO_ERROR = 14;
}

message Error {
  ErrorCode code = 1;
  string message_key = 2;
  bool retryable = 3;
  optional string detail = 4;
}

message Cancel {
  uint64 target_message_id = 1;
  string reason = 2;
}

message Stream {
  oneof item {
    StreamOpen open = 1;
    StreamChunk chunk = 2;
    StreamClose close = 3;
    StreamWindowUpdate window_update = 4;
  }
}

enum StreamPurpose {
  STREAM_PURPOSE_UNSPECIFIED = 0;
  STREAM_PURPOSE_SERIAL_RX = 1;
  STREAM_PURPOSE_FILE_READ = 2;
  STREAM_PURPOSE_FILE_WRITE = 3;
  STREAM_PURPOSE_CAPTURE = 4;
  STREAM_PURPOSE_TASK_LOG = 5;
}

message StreamOpen {
  uint64 stream_id = 1;
  StreamPurpose purpose = 2;
  uint32 initial_window_bytes = 3;
  optional uint64 total_bytes = 4;
}

message StreamChunk {
  uint64 stream_id = 1;
  uint64 offset = 2;
  bytes payload = 3;
  bool final_chunk = 4;
}

message StreamClose {
  uint64 stream_id = 1;
  optional Error error = 2;
}

message StreamWindowUpdate {
  uint64 stream_id = 1;
  uint32 additional_bytes = 2;
}

message Event {
  oneof item {
    PortCatalogChangedEvent port_catalog_changed = 10;
    SerialRxEvent serial_rx = 11;
    SurfaceInteractionEvent surface_interaction = 12;
    LocaleChangedEvent locale_changed = 13;
    ThemeChangedEvent theme_changed = 14;
    TaskStateEvent task_state = 15;
    RuntimeFaultEvent runtime_fault = 16;
  }
}

message ResourceBinding {
  string workspace_id = 1;
  string plugin_id = 2;
  string instance_id = 3;
  uint64 generation = 4;
  string resource_id = 5;
}

enum ColorScheme {
  COLOR_SCHEME_UNSPECIFIED = 0;
  COLOR_SCHEME_LIGHT = 1;
  COLOR_SCHEME_DARK = 2;
  COLOR_SCHEME_SYSTEM = 3;
}

message SessionSummary {
  string session_id = 1;
  string name = 2;
  bool connected = 3;
  uint64 rx_bytes = 4;
  uint64 tx_bytes = 5;
  uint64 generation = 6;
}

message HostContext {
  string workspace_id = 1;
  string plugin_id = 2;
  string instance_id = 3;
  uint64 generation = 4;
  string locale = 5;
  ColorScheme theme = 6;
  repeated Capability granted_capabilities = 7;
  ResourceLimits limits = 8;
  repeated SessionSummary sessions = 9;
}

enum SurfaceLocation {
  SURFACE_LOCATION_UNSPECIFIED = 0;
  SURFACE_LOCATION_WORKSPACE = 1;
  SURFACE_LOCATION_DETACHED_WINDOW = 2;
}

message PluginSurface {
  string surface_id = 1;
  string title = 2;
  SurfaceLocation location = 3;
}

message CommandContribution {
  string command_id = 1;
  string title = 2;
  string description = 3;
  bool long_running = 4;
  optional string confirmation = 5;
}

message PluginModel {
  repeated PluginSurface surfaces = 1;
  repeated CommandContribution commands = 2;
}

message InitializeRequest { HostContext context = 1; }
message InitializeResponse { PluginModel model = 1; }

message HandleEventRequest { PluginEvent event = 1; }
message HandleEventResponse { bool accepted = 1; }

message RunCommandRequest { CommandInvocation invocation = 1; }
message RunCommandResponse { string message = 1; }

message MigrateStateRequest {
  string previous_api = 1;
  uint32 state_schema_version = 2;
  bytes state = 3;
}
message MigrateStateResponse {
  uint32 state_schema_version = 1;
  bytes state = 2;
}
message ShutdownRequest {}

message CommandInvocation {
  string command_id = 1;
  string invocation_id = 2;
  repeated string arguments = 3;
}

message PluginEvent {
  oneof item {
    SurfaceInteraction surface = 1;
    LocaleChangedEvent locale_changed = 2;
    ThemeChangedEvent theme_changed = 3;
    PortCatalogChangedEvent port_catalog_changed = 4;
    CancelTaskEvent cancel_task = 5;
  }
}

message CancelTaskEvent { string task_id = 1; }

message RegisterSurfaceRequest { PluginSurface surface = 1; }
message UnregisterSurfaceRequest { string surface_id = 1; }
message RegisterCommandRequest { CommandContribution command = 1; }
message UnregisterCommandRequest { string command_id = 1; }

message TextNode { string text = 1; }
message BadgeNode { string text = 1; string tone = 2; }
message KeyValueEntry { string key = 1; string value = 2; }
message KeyValueNode { repeated KeyValueEntry entries = 1; }
message ProgressNode { uint32 value = 1; uint32 maximum = 2; string label = 3; }
message LogNode { string text = 1; optional string language = 2; }
message TableRow { repeated string cells = 1; }
message TableNode {
  repeated string columns = 1;
  repeated TableRow rows = 2;
  uint32 page = 3;
  uint32 page_size = 4;
  uint64 total_rows = 5;
}
message InputNode { string label = 1; string value = 2; string placeholder = 3; bool disabled = 4; }
message NumberInputNode {
  string label = 1;
  double value = 2;
  optional double minimum = 3;
  optional double maximum = 4;
  optional double step = 5;
  bool disabled = 6;
}
message SelectOption { string value = 1; string label = 2; }
message SelectNode { string label = 1; string value = 2; repeated SelectOption options = 3; bool disabled = 4; }
message ToggleNode { string label = 1; bool checked = 2; bool disabled = 3; }
message ButtonNode {
  string label = 1;
  bool disabled = 2;
  optional string confirmation = 3;
}
message GroupNode { string title = 1; }
message TabsNode { string selected_child_id = 1; }

message UiNode {
  string id = 1;
  optional string parent_id = 2;
  uint32 order = 3;
  oneof kind {
    EmptyNode column = 10;
    EmptyNode row = 11;
    GroupNode group = 12;
    TabsNode tabs = 13;
    TextNode text = 14;
    BadgeNode badge = 15;
    KeyValueNode key_value = 16;
    ProgressNode progress = 17;
    LogNode log = 18;
    LogNode code = 19;
    TableNode table = 20;
    InputNode input = 21;
    NumberInputNode number_input = 22;
    SelectNode select = 23;
    ToggleNode toggle = 24;
    ButtonNode button = 25;
    ButtonNode dangerous_button = 26;
  }
}
message EmptyNode {}

message SurfaceSnapshot {
  string surface_id = 1;
  uint64 revision = 2;
  string root_node_id = 3;
  repeated UiNode nodes = 4;
}

message UiPatchOperation {
  oneof operation {
    UiNode upsert = 1;
    string remove = 2;
    string set_root = 3;
  }
}

message SurfacePatch {
  string surface_id = 1;
  uint64 base_revision = 2;
  uint64 next_revision = 3;
  repeated UiPatchOperation operations = 4;
}

message PublishSurfaceSnapshotRequest { SurfaceSnapshot snapshot = 1; }
message PublishSurfacePatchRequest { SurfacePatch patch = 1; }

message SurfaceInteraction {
  string surface_id = 1;
  uint64 revision = 2;
  string node_id = 3;
  oneof value {
    string text = 10;
    double number = 11;
    bool toggle = 12;
    string selection = 13;
    EmptyNode action = 14;
  }
}

message SurfaceInteractionEvent { SurfaceInteraction interaction = 1; }
message PortCatalogChangedEvent {}
message LocaleChangedEvent { string locale = 1; }
message ThemeChangedEvent { ColorScheme theme = 1; }
message SerialRxEvent { ResourceBinding lease = 1; uint64 sequence = 2; bytes payload = 3; }

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RUNNING = 1;
  TASK_STATE_SUCCEEDED = 2;
  TASK_STATE_FAILED = 3;
  TASK_STATE_CANCELLED = 4;
}

message TaskStateEvent {
  string task_id = 1;
  TaskState state = 2;
  optional uint64 completed = 3;
  optional uint64 total = 4;
  string message = 5;
}

message RuntimeFaultEvent { Error error = 1; }
message ReportProgressRequest { TaskStateEvent progress = 1; }
message HeartbeatRequest { string task_id = 1; }

message SerialPort {
  string port_id = 1;
  string display_name = 2;
  optional uint32 usb_vendor_id = 3;
  optional uint32 usb_product_id = 4;
  optional string serial_number = 5;
}

enum SessionLifetime {
  SESSION_LIFETIME_UNSPECIFIED = 0;
  SESSION_LIFETIME_PERSISTENT = 1;
  SESSION_LIFETIME_RUNTIME = 2;
}
enum Parity {
  reserved 4, 5;
  reserved "PARITY_MARK", "PARITY_SPACE";
  PARITY_UNSPECIFIED = 0;
  PARITY_NONE = 1;
  PARITY_ODD = 2;
  PARITY_EVEN = 3;
}
enum StopBits {
  reserved 2;
  reserved "STOP_BITS_ONE_POINT_FIVE";
  STOP_BITS_UNSPECIFIED = 0;
  STOP_BITS_ONE = 1;
  STOP_BITS_TWO = 3;
}
enum FlowControl {
  FLOW_CONTROL_UNSPECIFIED = 0;
  FLOW_CONTROL_NONE = 1;
  FLOW_CONTROL_SOFTWARE = 2;
  FLOW_CONTROL_HARDWARE = 3;
}

message SerialConfig {
  uint32 baud_rate = 1;
  uint32 data_bits = 2;
  Parity parity = 3;
  StopBits stop_bits = 4;
  FlowControl flow_control = 5;
}

message SerialSession {
  string session_id = 1;
  string name = 2;
  optional string port_id = 3;
  SerialConfig config = 4;
  bool connected = 5;
  uint64 generation = 6;
}

message ListPortsRequest {}
message ListPortsResponse { repeated SerialPort ports = 1; }
message ListSessionsRequest {}
message ListSessionsResponse { repeated SerialSession sessions = 1; }
message CreateSessionRequest {
  string local_id = 1;
  string name = 2;
  SessionLifetime lifetime = 3;
  optional string port_id = 4;
  SerialConfig config = 5;
}
message UpdateSessionRequest { SerialSession session = 1; }
message ConnectSessionRequest { string session_id = 1; }
message DisconnectSessionRequest { string session_id = 1; }
message DeleteSessionRequest { string session_id = 1; }
message SessionResponse { SerialSession session = 1; }

message SerialLeaseOptions {
  bool pause_automation = 1;
  uint32 rx_buffer_bytes = 2;
}
message AcquireSerialLeaseRequest { string session_id = 1; SerialLeaseOptions options = 2; }
message AcquireSerialLeaseResponse { ResourceBinding lease = 1; uint64 session_generation = 2; }
message ReleaseSerialLeaseRequest { ResourceBinding lease = 1; }
message SerialReadRequest { ResourceBinding lease = 1; uint32 max_bytes = 2; uint32 timeout_ms = 3; }
message SerialReadResponse { bytes payload = 1; bool timed_out = 2; bool disconnected = 3; }
message SerialWriteRequest { ResourceBinding lease = 1; bytes payload = 2; }

enum WriteOutcome {
  WRITE_OUTCOME_UNSPECIFIED = 0;
  WRITE_OUTCOME_COMPLETED = 1;
  WRITE_OUTCOME_PARTIAL_WRITE = 2;
  WRITE_OUTCOME_UNKNOWN_OUTCOME = 3;
}
message SerialWriteResponse { uint64 requested = 1; uint64 sent = 2; WriteOutcome outcome = 3; }
message ClearSerialBuffersRequest { ResourceBinding lease = 1; }
message PendingSerialBytesRequest { ResourceBinding lease = 1; }
message PendingSerialBytesResponse { uint64 rx = 1; uint64 tx = 2; }
message OutputLines { bool dtr = 1; bool rts = 2; bool break_active = 3; }
message InputLines { bool cts = 1; bool dsr = 2; bool ri = 3; bool cd = 4; }
message SetOutputLinesRequest { ResourceBinding lease = 1; OutputLines lines = 2; }
message ReadInputLinesRequest { ResourceBinding lease = 1; }
message ReadInputLinesResponse { InputLines lines = 1; }

enum FrameDirection {
  FRAME_DIRECTION_UNSPECIFIED = 0;
  FRAME_DIRECTION_RX = 1;
  FRAME_DIRECTION_TX = 2;
}
message CaptureFrame {
  uint64 sequence = 1;
  uint64 timestamp_ms = 2;
  FrameDirection direction = 3;
  bytes payload = 4;
}
message CaptureReadRequest {
  string session_id = 1;
  uint64 from_sequence = 2;
  uint32 max_frames = 3;
  uint32 max_bytes = 4;
}
message CaptureReadResponse { repeated CaptureFrame frames = 1; optional uint64 next_sequence = 2; }

message QuickCommand {
  string local_id = 1;
  string title = 2;
  bytes payload = 3;
  bool append_newline = 4;
  string session_id = 5;
}
message MacroStep { uint32 delay_ms = 1; bytes payload = 2; }
message MacroContribution {
  string local_id = 1;
  string title = 2;
  repeated MacroStep steps = 3;
  string session_id = 4;
}
message UpsertQuickCommandRequest { QuickCommand command = 1; }
message DeleteQuickCommandRequest { string local_id = 1; string session_id = 2; }
message UpsertMacroRequest { MacroContribution macro = 1; }
message DeleteMacroRequest { string local_id = 1; string session_id = 2; }
message ContributionResponse { string contribution_id = 1; }

message FileGrantInfo {
  ResourceBinding grant = 1;
  string display_name = 2;
  optional uint64 size = 3;
}
message OpenReadGrantRequest { repeated string accepted_extensions = 1; }
message OpenReadGrantResponse { optional FileGrantInfo grant = 1; }
message ReadGrantChunkRequest { ResourceBinding grant = 1; uint64 offset = 2; uint32 max_bytes = 3; }
message ReadGrantChunkResponse { uint64 offset = 1; uint64 total_bytes = 2; bytes payload = 3; }
message CloseReadGrantRequest { ResourceBinding grant = 1; }
message CreateSaveGrantRequest { string suggested_name = 1; }
message CreateSaveGrantResponse { optional FileGrantInfo grant = 1; }
message WriteSaveGrantRequest { ResourceBinding grant = 1; bytes payload = 2; }
message WriteSaveGrantResponse { uint64 accepted_bytes = 1; }
message CommitSaveGrantRequest { ResourceBinding grant = 1; }
message CancelSaveGrantRequest { ResourceBinding grant = 1; }

message StorageGetRequest { string key = 1; }
message StorageGetResponse { optional bytes value = 1; }
message StorageSetRequest { string key = 1; bytes value = 2; }
message StorageDeleteRequest { string key = 1; }
message ProjectStateGetRequest {}
message ProjectStateGetResponse { optional uint32 schema_version = 1; optional bytes value = 2; }
message ProjectStateSetRequest { uint32 schema_version = 1; bytes value = 2; }
