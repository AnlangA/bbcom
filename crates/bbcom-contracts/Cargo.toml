[package]
name = "bbcom-contracts"
version = "0.1.0"
description = "Single-source Rust and TypeScript wire contracts for bbcom"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
