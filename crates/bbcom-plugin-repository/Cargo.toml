[package]
name = "bbcom-plugin-repository"
version = "0.1.0"
description = "Verified manual repository downloads and staged plugin installation for bbcom"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
atomic-write-file = "=0.3.1"
bbcom-plugin-contracts = { path = "../bbcom-plugin-contracts" }
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
url = "=2.5.8"
zip = { version = "=8.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
sha2 = "=0.10.9"
tempfile = "=3.27.0"
wat = "=1.252.0"

[lints.rust]
unsafe_code = "forbid"
