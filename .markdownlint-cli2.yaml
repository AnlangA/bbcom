# Keep Markdown linting strict while accommodating the repository's intentional
# long tables, GitHub-rendered HTML screenshot grids, and external references.
config:
  MD013: false # long architecture/compatibility tables are kept readable as rows
  MD033: false # README uses GitHub-supported HTML image/layout grids
  MD034: false # changelog keeps historical bare-reference URLs intact
  MD036: false # existing bilingual docs use emphasized section labels
  MD041: false # README begins with a centered GitHub presentation block
  MD056: false # legacy plan tables include literal pipe-delimited examples
# Local agent session artifacts are machine-generated, not project docs.
ignores:
  - .zcode/
  - '**/target/**'
