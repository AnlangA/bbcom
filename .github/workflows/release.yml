name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates for tagged commit
    uses: ./.github/workflows/quality.yml

  validate:
    name: Validate release source
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Reject non-SemVer tags and non-master commits
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z" >&2
            exit 1
          fi
          git fetch --no-tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$version"
          grep -Fq "## [$version]" CHANGELOG.md

      - name: Setup Rust 1.97.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify synchronized versions
        run: pnpm run version:check

      - name: Prepare release metadata directory
        run: mkdir -p release-metadata

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-metadata/bbcom-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install pinned Rust license tool
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-license@0.7.0

      - name: Generate third-party license inventories
        shell: bash
        run: |
          mkdir -p release-metadata
          pnpm licenses list --prod --json > release-metadata/frontend-licenses.json
          node -e "const x=require('./release-metadata/frontend-licenses.json'); if (x.error) process.exit(1)"
          cargo license --manifest-path src-tauri/Cargo.toml --json \
            > release-metadata/rust-licenses.json

      - name: Upload release metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-metadata
          path: release-metadata/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.name }} installer
    needs: [quality, validate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      WINDOWS_SIGNING_AVAILABLE: ${{ secrets.WINDOWS_CERTIFICATE != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
      APPLE_SIGNING_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
            executable: target/x86_64-pc-windows-msvc/release/bbcom.exe
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64
            executable: target/aarch64-apple-darwin/release/bbcom
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
            executable: target/x86_64-unknown-linux-gnu/release/bbcom
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get \
            -o Acquire::Languages=none \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            dbus-x11 \
            xvfb \
            webkit2gtk-driver

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Windows signing certificate when configured
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_AVAILABLE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are required'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'bbcom-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert.Thumbprint) { throw 'Windows signing certificate import failed' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Record platform signing availability
        shell: bash
        run: |
          mkdir -p release-assets
          if [[ "$RUNNER_OS" == Windows ]]; then
            if [[ "$WINDOWS_SIGNING_AVAILABLE" == true ]]; then
              echo '- Windows NSIS: Authenticode signing secrets are configured.' \
                > release-assets/windows-signing-status.txt
            else
              echo '- Windows NSIS: unsigned (WINDOWS_CERTIFICATE secrets not configured).' \
                > release-assets/windows-signing-status.txt
            fi
          elif [[ "$RUNNER_OS" == macOS ]]; then
            if [[ "$APPLE_SIGNING_AVAILABLE" == true ]]; then
              echo '- macOS DMG: Developer ID signing/notarization secrets are configured.' \
                > release-assets/macos-signing-status.txt
            else
              echo '- macOS DMG: unsigned (APPLE_* secrets not configured).' \
                > release-assets/macos-signing-status.txt
            fi
          fi

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_AVAILABLE -eq 'true') {
            $config = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:WINDOWS_CERTIFICATE_THUMBPRINT
                  digestAlgorithm = 'sha256'
                  timestampUrl = 'http://timestamp.digicert.com'
                }
              }
            } | ConvertTo-Json -Compress -Depth 5
            pnpm tauri:build --target ${{ matrix.target }} --bundles nsis --config $config
          } else {
            pnpm tauri:build --target ${{ matrix.target }} --bundles nsis
          }

      - name: Build macOS DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_AVAILABLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri:build --target ${{ matrix.target }} --bundles dmg

      - name: Build unsigned macOS DMG
        if: runner.os == 'macOS' && env.APPLE_SIGNING_AVAILABLE != 'true'
        run: pnpm tauri:build --target ${{ matrix.target }} --bundles dmg

      - name: Build Linux AppImage and deb installers
        if: runner.os == 'Linux'
        run: pnpm tauri:build --target ${{ matrix.target }} --bundles appimage,deb

      - name: Smoke-test the built native application shell
        if: runner.os == 'Windows'
        env:
          BBCOM_E2E_BINARY: ${{ github.workspace }}/${{ matrix.executable }}
        run: pnpm run e2e:native

      - name: Smoke-test the built native application shell on Linux
        if: runner.os == 'Linux'
        env:
          BBCOM_E2E_BINARY: ${{ github.workspace }}/${{ matrix.executable }}
        run: xvfb-run -a pnpm run e2e:native

      - name: Verify, install, launch, and uninstall Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = Get-ChildItem 'target/${{ matrix.target }}/release/bundle/nsis/*.exe'
          if ($installers.Count -ne 1) { throw "expected one NSIS installer, found $($installers.Count)" }
          if ($env:WINDOWS_SIGNING_AVAILABLE -eq 'true') {
            $signature = Get-AuthenticodeSignature $installers[0].FullName
            if ($signature.Status -ne 'Valid') { throw "invalid Authenticode signature: $($signature.Status)" }
            '- Windows NSIS: Authenticode signed and verified.' |
              Set-Content release-assets/windows-signing-status.txt
          }

          $installRoot = Join-Path $env:RUNNER_TEMP 'bbcom-smoke'
          $installer = Start-Process -FilePath $installers[0].FullName `
            -ArgumentList '/S', "/D=$installRoot" -PassThru -Wait
          if ($installer.ExitCode -ne 0) {
            throw "NSIS installer exited with $($installer.ExitCode)"
          }
          $application = Get-ChildItem -Path $installRoot -Filter 'bbcom.exe' -Recurse | Select-Object -First 1
          if ($null -eq $application) { throw 'NSIS installation did not contain bbcom.exe' }

          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "installed bbcom exited during launch smoke with $($process.ExitCode)" }
          if (-not $process.CloseMainWindow()) { throw 'installed bbcom did not expose a main window to close' }
          if (-not $process.WaitForExit(10000)) {
            Stop-Process -Id $process.Id -Force
            throw 'installed bbcom did not close within 10 seconds'
          }

          $uninstaller = Get-ChildItem -Path $installRoot -Filter '*uninstall*.exe' -Recurse | Select-Object -First 1
          if ($null -eq $uninstaller) { throw 'NSIS installation did not contain an uninstaller' }
          $uninstall = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstaller exited with $($uninstall.ExitCode)"
          }
          if (Test-Path $installRoot) { throw 'NSIS uninstall left the installation directory behind' }
          Copy-Item $installers[0].FullName release-assets/

      - name: Verify, install, launch, and uninstall macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmg=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test "${#dmg[@]}" -eq 1
          mkdir -p release-assets

          mount_dir="$RUNNER_TEMP/bbcom-dmg"
          install_dir="$RUNNER_TEMP/bbcom-smoke-applications"
          installed_app="$install_dir/bbcom.app"
          app_pid=''
          cleanup() {
            if [[ -n "$app_pid" ]] && kill -0 "$app_pid" 2>/dev/null; then
              kill -TERM "$app_pid" || true
              wait "$app_pid" || true
            fi
            if mount | grep -Fq "on $mount_dir "; then
              hdiutil detach "$mount_dir" || true
            fi
            rm -rf "$mount_dir" "$install_dir"
          }
          trap cleanup EXIT

          mkdir -p "$mount_dir" "$install_dir"
          hdiutil attach "${dmg[0]}" -nobrowse -readonly -mountpoint "$mount_dir"
          mounted_app=("$mount_dir"/*.app)
          test "${#mounted_app[@]}" -eq 1
          if [[ "$APPLE_SIGNING_AVAILABLE" == true ]]; then
            xcrun stapler validate "${dmg[0]}"
            codesign --verify --deep --strict --verbose=2 "${mounted_app[0]}"
            echo '- macOS DMG: Developer ID signed and notarized.' \
              > release-assets/macos-signing-status.txt
          fi
          cp -R "${mounted_app[0]}" "$installed_app"
          test -x "$installed_app/Contents/MacOS/bbcom"

          "$installed_app/Contents/MacOS/bbcom" > "$RUNNER_TEMP/bbcom-macos-smoke.log" 2>&1 &
          app_pid="$!"
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/bbcom-macos-smoke.log"
            exit 1
          fi
          kill -TERM "$app_pid"
          for _ in {1..10}; do
            kill -0 "$app_pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/bbcom-macos-smoke.log"
            exit 1
          fi
          wait "$app_pid" || true
          app_pid=''
          rm -rf "$installed_app"
          test ! -e "$installed_app"
          hdiutil detach "$mount_dir"
          rm -rf "$mount_dir"
          cp "${dmg[0]}" release-assets/

      - name: Verify, launch, and uninstall Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          appimage=(target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          deb=(target/${{ matrix.target }}/release/bundle/deb/*.deb)
          test "${#appimage[@]}" -eq 1
          test "${#deb[@]}" -eq 1

          run_gui_smoke() {
            local label="$1"
            shift
            local log="$RUNNER_TEMP/bbcom-${label}-smoke.log"
            set +e
            xvfb-run -a timeout --signal=TERM --kill-after=5s 8s "$@" >"$log" 2>&1
            local status=$?
            set -e
            if [[ "$status" -ne 124 ]]; then
              cat "$log"
              echo "$label exited before the eight-second launch smoke (status $status)" >&2
              exit 1
            fi
          }

          chmod +x "${appimage[0]}"
          run_gui_smoke appimage env APPIMAGE_EXTRACT_AND_RUN=1 "${GITHUB_WORKSPACE}/${appimage[0]}"
          dpkg-deb --info "${deb[0]}" >/dev/null
          package="$(dpkg-deb -f "${deb[0]}" Package)"
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y "${GITHUB_WORKSPACE}/${deb[0]}"
          binary="$(dpkg -L "$package" | awk '/^\/usr\/bin\// { print; exit }')"
          test -n "$binary"
          test -x "$binary"
          run_gui_smoke deb "$binary"
          sudo apt-get remove -y "$package"
          test "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" != installed
          mkdir -p release-assets
          cp "${appimage[0]}" "${deb[0]}" release-assets/
          echo '- Linux AppImage/deb: Sigstore keyless bundles are attached by the release job.' \
            > release-assets/linux-signing-status.txt

      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft GitHub release
    needs: [quality, validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download installers and metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release
          merge-multiple: true

      - name: Verify complete release set
        shell: bash
        run: |
          shopt -s nullglob
          nsis=(release/*.exe)
          dmg=(release/*.dmg)
          appimage=(release/*.AppImage)
          deb=(release/*.deb)
          sbom=(release/*.cdx.json)
          signing_status=(release/*-signing-status.txt)
          test "${#nsis[@]}" -eq 1
          test "${#dmg[@]}" -eq 1
          test "${#appimage[@]}" -eq 1
          test "${#deb[@]}" -eq 1
          test "${#sbom[@]}" -eq 1
          test "${#signing_status[@]}" -eq 3
          test -f release/frontend-licenses.json
          test -f release/rust-licenses.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Keyless-sign Linux installers
        shell: bash
        run: |
          for artifact in release/*.AppImage release/*.deb; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Generate checksums and release notes
        shell: bash
        run: |
          (
            cd release
            checksum_tmp="../SHA256SUMS.tmp"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #' > "$checksum_tmp"
            mv "$checksum_tmp" SHA256SUMS
          )
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo '## Artifact signing status'
            cat release/*-signing-status.txt
          } >> release-notes.md
          test -s release-notes.md

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*

      - name: Create draft release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          draft: true
          prerelease: false
          generate_release_notes: false
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
