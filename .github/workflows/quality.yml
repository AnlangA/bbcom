name: Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend correctness and coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level moderate

      - name: Lint source, documentation, and shell scripts
        run: |
          pnpm run lint
          pnpm run lint:markdown
          pnpm run lint:shell

      - name: Check Prettier formatting
        run: >-
          pnpm exec prettier --check
          src/ tests/ scripts/ docs/
          README.md README.zh-CN.md ARCHITECTURE.md CHANGELOG.md CONTRIBUTING.md
          RELEASING.md SECURITY.md AGENTS_PLAN.md
          package.json pnpm-workspace.yaml
          .markdownlint-cli2.yaml vite.config.ts vitest.config.ts
          wdio.browser-mock.config.mjs wdio.native.config.mjs eslint.config.mjs
          tsconfig.json tsconfig.node.json tsconfig.eslint.json index.html
          .github/workflows/

      - name: Verify architecture boundaries
        run: |
          pnpm run architecture:selftest
          pnpm run architecture
          pnpm run tokens:check

      - name: Build frontend
        run: pnpm run build

      - name: Enforce bundle budgets
        run: pnpm run bundle:check

      # The coverage command executes the complete Vitest suite. Do not add a
      # separate test:frontend step here; that would run every test twice.
      - name: Test frontend and enforce coverage
        run: node scripts/run-frontend-coverage-gates.mjs

  rust:
    name: Rust correctness and coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - name: Setup Rust 1.97.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pinned Rust quality tools
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-llvm-cov@0.8.7

      - name: Audit Rust dependencies
        run: cargo audit --deny unsound --deny yanked --file Cargo.lock

      - name: Verify generated IPC contracts
        run: cargo run -p xtask --locked -- bindings --check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust targets
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --all-features --locked -- -D warnings

      # cargo llvm-cov executes the complete Rust test suite. A separate
      # cargo test step would only duplicate the same tests.
      - name: Test Rust and enforce coverage
        run: >-
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml
          --workspace --all-features --locked
          --fail-under-lines 80 --fail-under-functions 75

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run browser mock E2E
        run: pnpm run e2e:browser:local

  quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs:
      - frontend
      - rust
      - browser-e2e
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every correctness job
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          BROWSER_E2E_RESULT: ${{ needs['browser-e2e'].result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
          test "$BROWSER_E2E_RESULT" = success

  benchmark:
    name: Master/manual frontend benchmark
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    needs: quality-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout source and history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend benchmark comparison
        run: pnpm run bench:frontend:compare
