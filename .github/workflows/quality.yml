name: Quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend correctness
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install ShellCheck
        run: |
          sudo apt-get \
            -o Acquire::Languages=none \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends shellcheck

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source, documentation, and shell scripts
        run: |
          pnpm run lint
          pnpm run lint:markdown
          pnpm run lint:shell

      - name: Check Prettier formatting
        run: >-
          pnpm exec prettier --check
          src/ tests/ scripts/
          README.md README.zh-CN.md ARCHITECTURE.md CHANGELOG.md CONTRIBUTING.md
          SECURITY.md
          package.json pnpm-workspace.yaml
          .markdownlint-cli2.yaml vite.config.ts vitest.config.ts
          wdio.browser-mock.config.mjs wdio.native.config.mjs eslint.config.mjs
          tsconfig.json tsconfig.node.json tsconfig.eslint.json index.html
          .github/workflows/

      - name: Verify architecture boundaries
        run: |
          pnpm run architecture:selftest
          pnpm run architecture
          pnpm run tokens:check

      - name: Build frontend
        run: pnpm run build

      - name: Enforce bundle budgets
        run: pnpm run bundle:check

  rust:
    name: Rust correctness
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install native build dependencies
        run: |
          sudo apt-get \
            -o Acquire::Languages=none \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - name: Setup Rust 1.97.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify generated IPC contracts
        run: cargo run -p xtask --locked -- bindings --check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust targets
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --workspace --all-targets --all-features --locked -- -D warnings

  quality-gate:
    name: Required quality gate
    if: ${{ always() }}
    needs:
      - frontend
      - rust
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every correctness job
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
