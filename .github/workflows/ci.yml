name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Keep this display name stable: master branch protection requires it.
    name: Frontend (lint + format + build + test + bench)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install shell lint dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (moderate and above)
        run: pnpm audit --audit-level moderate

      - name: Lint
        run: pnpm run lint

      - name: Markdown lint
        run: pnpm run lint:markdown

      - name: Shell lint
        run: pnpm run lint:shell

      - name: Format check
        run: pnpm run format:check

      - name: Architecture boundaries and cycles
        run: pnpm run architecture

      - name: Type-check and build
        run: pnpm run build

      - name: Frontend bundle-size gate
        run: pnpm run bundle:check

      - name: Frontend tests
        run: pnpm run test:frontend

      - name: Frontend coverage gate
        run: pnpm run coverage:frontend

      # Run even when the global gate already failed so failures always name
      # the exact P0 domain that lacks coverage. This remains a hard gate:
      # either non-zero step fails the required frontend job.
      - name: P0 frontend coverage gate
        if: always()
        run: pnpm run coverage:p0

      - name: Benchmark against the base commit on the same runner
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base_sha="$EVENT_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          base_dir="$RUNNER_TEMP/bbcom-benchmark-base"
          results_dir="$RUNNER_TEMP/bbcom-benchmark-results"
          git worktree add --detach "$base_dir" "$base_sha"
          mkdir -p "$results_dir"
          (
            cd "$base_dir"
            pnpm install --frozen-lockfile
          )
          cp tests/frontend/perf.bench.ts "$base_dir/tests/frontend/perf.bench.ts"
          if ! command -v taskset >/dev/null; then
            echo "taskset is required to keep base/head measurements on one CPU" >&2
            exit 1
          fi
          benchmark_cpu="$(taskset -pc "$$" | sed -E 's/.*: ([0-9]+).*/\1/')"
          if ! [[ "$benchmark_cpu" =~ ^[0-9]+$ ]]; then
            echo "could not determine an allowed benchmark CPU" >&2
            exit 1
          fi
          benchmark() {
            BENCH_OUTPUT="$1" taskset --cpu-list "$benchmark_cpu" node --test --experimental-strip-types \
              --import ./tests/frontend/register-loader.mjs tests/frontend/perf.bench.ts
          }
          for run in 1 2 3; do
            (
              cd "$base_dir"
              benchmark "$results_dir/base-$run.json"
            )
            benchmark "$results_dir/head-$run.json"
          done
          node scripts/compare-frontend-benchmarks.mjs "$results_dir"

  rust:
    # Keep this display name stable: master branch protection requires it.
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt,llvm-tools-preview

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: .

      - name: Install pinned Rust quality tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Rust dependency audit
        run: cargo audit --deny unsound --deny yanked --file Cargo.lock

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml --workspace
          --all-targets --all-features --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-features --locked

      - name: Rust coverage gate
        run: >-
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --workspace
          --all-features --locked --fail-under-lines 80 --fail-under-functions 75
          --html --output-dir coverage/rust

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-coverage
          path: coverage/rust
          if-no-files-found: error
          retention-days: 14
