name: E2E

on:
  pull_request:
  schedule:
    - cron: '15 2 * * *'

permissions:
  contents: read

jobs:
  browser-mock:
    name: E2E browser mock
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run renderer browser-mock smoke test
        shell: bash
        run: |
          pnpm dev -- --host 127.0.0.1 > "$RUNNER_TEMP/bbcom-vite.log" 2>&1 &
          vite_pid=$!
          trap 'if kill -0 "$vite_pid" 2>/dev/null; then kill "$vite_pid"; fi' EXIT
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5173/ >/dev/null
          pnpm run e2e:browser

  native:
    name: E2E native ${{ matrix.name }}
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            binary: target/debug/bbcom
          - name: windows
            os: windows-2022
            binary: target/debug/bbcom.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Install Linux native WebDriver prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev \
            librsvg2-dev patchelf libudev-dev
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri:build --debug --no-bundle
      - name: Run native smoke test
        env:
          BBCOM_E2E_BINARY: ${{ matrix.binary }}
        run: pnpm run e2e:native
