[workspace]
members = [
  "src-tauri",
  "crates/bbcom-contracts",
  "crates/bbcom-plugin-contracts",
  "crates/bbcom-plugin-broker",
  "crates/bbcom-plugin-host",
  "crates/bbcom-plugin-manager",
  "crates/bbcom-plugin-repository",
  "crates/bbcom-plugin-trust",
  "crates/bbcom-workspace",
  "crates/xtask",
]
resolver = "3"

[patch.crates-io]
# This reviewed glib backport is kept in-tree until Tauri's Linux backend can
# consume a fixed upstream release.
glib = { path = "src-tauri/vendor/security-patches/glib-0.18.5" }
