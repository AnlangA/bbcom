[package]
name = "bbcom-counter-v2"
version = "2.0.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "BBCOM protocol-v2 counter, contribution, and serial-lease example plugin"
license = "MIT"

# This is deliberately separate from BBCOM's root workspace. CI invokes it
# explicitly and host builds do not accidentally compile a Wasm Component.
[workspace]
members = ["packager"]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["component"]
component = ["dep:wit-bindgen"]
std = []

[dependencies]
bbcom-plugin-guest-runtime = { path = "../plugin-guest-runtime" }
bbcom-plugin-sdk = { path = "../../crates/bbcom-plugin-sdk" }
wit-bindgen = { version = "=0.43.0", default-features = false, features = ["macros", "realloc"], optional = true }

[dev-dependencies]
bbcom-plugin-component-audit = { path = "../plugin-component-audit" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
