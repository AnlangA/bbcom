[package]
name = "bbcom-mcumgr-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "no_std MCUmgr/SMP protocol core for the BBCOM v2 plugin"
license = "MIT"

# This subtree is deliberately standalone. Host builds never compile its
# wasm32-wasip2 component, while focused checks can cover both the reusable
# protocol core and the v2 guest adapter.
[workspace]
members = ["guest", "packager"]
resolver = "3"

[lib]
crate-type = ["rlib"]

[features]
default = []
std = []

[dependencies]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
