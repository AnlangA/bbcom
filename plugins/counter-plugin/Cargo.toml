[package]
name = "bbcom-counter-panel"
version = "1.0.0"
edition = "2021"
publish = false
description = "bbcom sample plugin: a persistent serial counter rendered as a declarative panel"

# Standalone guest workspace: intentionally NOT a member of the repository
# workspace so host builds never compile the wasm32-wasip2 target.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.43.0", default-features = false, features = ["macros", "realloc"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
